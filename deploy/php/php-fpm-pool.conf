; Nexas — PHP-FPM pool
;
; Copy to /etc/php/8.4/fpm/pool.d/nexas.conf and reload:
;   systemctl reload php8.4-fpm
;
; Nginx talks to this pool over the socket named below. It is a socket rather
; than a TCP port because both processes are on the same machine, and a
; socket cannot be reached from anywhere else by accident.

[nexas]

; The owner of the application files. It needs to read the release and to
; write inside shared/storage — nothing else on the machine.
user = nexas
group = www-data

listen = /run/php/php8.4-fpm-nexas.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sizing. The API answers JSON and hands file downloads to Nginx, so a worker
; is held for a fraction of a second at a time. Twelve children is generous
; for a 2 vCPU machine; the ceiling matters because each child holds a PHP
; process of roughly 40–60 MB once the framework is loaded.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Children are recycled, so a slow leak in a dependency cannot grow forever.
pm.max_requests = 500

pm.status_path = /php-fpm-status

; Slightly above max_execution_time (120s, set in 99-nexas.ini) so PHP's own
; limit fires first and the request returns a logged 500. A shorter timeout
; here would have FPM kill the worker with nothing written down.
request_terminate_timeout = 130s

; Anything a child writes to stderr has to reach the log, or a fatal during
; bootstrap leaves no trace at all.
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/php8.4-fpm-nexas.log
php_admin_flag[log_errors] = on

; Restricts the filesystem a web request can touch. Everything the application
; reads or writes is under its own directory; /tmp is where the shared upload
; validator and the CSV reader put their scratch files. Rendered PDFs are made
; by the queue worker, which runs from the CLI and is not pooled here.
php_admin_value[open_basedir] = /var/www/nexas:/tmp:/usr/share/php
