# Nexas — Nginx site configuration
#
# Copy to /etc/nginx/sites-available/nexas.conf and enable it with
#   ln -s /etc/nginx/sites-available/nexas.conf /etc/nginx/sites-enabled/
# replacing staging.example.co.tz with the real hostname first.
#
# The document root is public/, so nothing above it is reachable at all. The
# disks that hold bank statements, filed documents, rendered exports and the
# nightly backups all live under storage/app/private, which is outside the
# root by construction. The denies further down are a second line of defence
# for the day somebody edits the root and gets it one level too high.

upstream nexas_fpm {
    server unix:/run/php/php8.4-fpm-nexas.sock;
}

# Plain HTTP exists only to redirect and to answer the certificate challenge.
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.co.tz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 is enabled on the listen line rather than with the newer
    # "http2 on;" directive, which needs Nginx 1.25.1. Ubuntu 24.04 LTS ships
    # 1.24; on a newer Nginx either form works and this one only logs a
    # deprecation notice.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name staging.example.co.tz;

    root /var/www/nexas/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/staging.example.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nexas_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # An attachment may be 10 MB (NEXAS_ATTACHMENT_MAX_KILOBYTES); the web
    # server has to allow a little more than that, or the request is refused
    # with Nginx's own 413 before Laravel can say which file it refused.
    client_max_body_size 16m;
    client_body_timeout 60s;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/nexas.access.log;
    error_log  /var/log/nginx/nexas.error.log warn;

    # Built assets carry a content hash in their filename, so the same URL
    # never means two different files and they can be cached indefinitely.
    # The prefix match wins over the regex denies below because of the ^~.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The application's own probe, for the load balancer. Kept out of the
    # access log: a check every few seconds would bury everything else.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # A request for a PHP file that is not there is a 404 rather than a
        # pass to index.php. Handing every path ending in .php to the front
        # controller is how a stray upload ends up being executed.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass nexas_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Nginx terminates TLS here, so Laravel is told the request arrived
        # over https. Without this it builds http links and refuses to set a
        # secure session cookie.
        fastcgi_param HTTPS $https;

        # A signed download streams a rendered report straight through
        # instead of Nginx buffering the whole file first. The JSON the API
        # returns is small enough that the setting makes no difference to it.
        fastcgi_buffering off;

        # A trial balance read across a long period, or an ageing report, is
        # slower than the 60s FastCGI default.
        fastcgi_read_timeout 120s;
    }

    # Dotfiles, except the certificate challenge above.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Application internals, in case the root is ever pointed one level too
    # high. These are not reachable from public/ as the root stands.
    location ~* ^/(app|bootstrap|config|database|deploy|docs|resources|routes|storage|tests|vendor)/ {
        deny all;
    }

    # Anything that is a secret, a dump or a key, wherever it has landed.
    location ~* \.(env|log|sql|sqlite|dump|key|pem|p12|pfx|ini|neon)$ {
        deny all;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
