; Nexas — PHP settings
;
; Copy to both, because the web tier and the CLI must agree:
;   /etc/php/8.4/fpm/conf.d/99-nexas.ini
;   /etc/php/8.4/cli/conf.d/99-nexas.ini
;
; The CLI copy is not optional. The queue worker renders the PDF exports and
; the scheduler takes the nightly backup; if they read a smaller memory limit
; or a shorter execution time than the web tier, the failure lands in the
; queue rather than in a request the user can see.

; An attachment may be 10 MB (NEXAS_ATTACHMENT_MAX_KILOBYTES=10240), and a
; bank statement CSV is read through the same validator. post_max_size is the
; one that has to exceed the file, because the whole multipart body is
; measured against it.
upload_max_filesize = 16M
post_max_size = 17M
max_file_uploads = 10

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; The application's clock. config/app.php reads APP_TIMEZONE and sets it at
; boot, so the authoritative value is in .env; this is here for the CLI work
; that runs before the framework starts and for the log timestamps.
;
; It matters more than it looks: the nightly schedule (ledger:verify 02:30,
; audit:verify 02:45, backups:run 03:15) is read in this timezone. On a server
; left at UTC the backup would be taken at 06:15 Dar es Salaam time.
date.timezone = Africa/Dar_es_Salaam

expose_php = Off
display_errors = Off
log_errors = On

; A Laravel request touches a few hundred files. Caching their real paths is
; the cheapest throughput win available.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; OPcache. The code does not change between releases — it changes when a new
; release is activated — so timestamps are not checked.
;
; validate_timestamps = 0 makes a reload part of the deployment: PHP-FPM is
; reloaded by deploy/release.sh, and without that a request would keep running
; the code it loaded before the swap. That is the whole reason the script
; reloads. It is also why opcache is off for the CLI: the scheduler is a
; long-lived process, and a stale copy of the code there would be invisible.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off
