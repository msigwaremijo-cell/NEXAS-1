; Nexas — queue workers and the scheduler
;
; Copy to /etc/supervisor/conf.d/nexas.conf, create /var/log/nexas owned by
; the application user, then:
;   supervisorctl reread && supervisorctl update
;
; Two long-running processes: the workers that render report exports and raise
; the alerts, and the scheduler that fires the nightly checks. Both have to be
; running for the application to be doing what it says it does — a report the
; user has been told is being prepared, and a backup nobody took, are both
; silent failures.

[program:nexas-worker]
process_name = %(program_name)s_%(process_num)02d
command = /usr/bin/php /var/www/nexas/current/artisan queue:work --sleep=3 --tries=3 --timeout=240 --max-time=3600 --max-jobs=500
directory = /var/www/nexas/current
user = nexas
numprocs = 2
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stopasgroup = true
killasgroup = true
redirect_stderr = true
stdout_logfile = /var/log/nexas/worker.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 5

; --timeout=240 must stay below the connection's retry_after, which is 300s in
; .env.staging.example. If it were the other way round, Redis would hand the
; same job to a second worker while the first was still running, and a large
; export would be written twice.
;
; --max-time and --max-jobs recycle a worker hourly or every 500 jobs, so a
; leak or a piece of stale state cannot live in a process for a month.
;
; No --queue is given. The queue name comes from REDIS_QUEUE in the
; environment, so there is one place to change it rather than two.

[program:nexas-scheduler]
command = /usr/bin/php /var/www/nexas/current/artisan schedule:work
directory = /var/www/nexas/current
user = nexas
numprocs = 1
autostart = true
autorestart = true
startsecs = 5
startretries = 3

; schedule:work forks schedule:run once a minute, so the whole group has to be
; signalled on a stop; otherwise the parent exits and the child is left behind.
stopasgroup = true
killasgroup = true
stopwaitsecs = 90

redirect_stderr = true
stdout_logfile = /var/log/nexas/scheduler.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 5

; Exactly one of these may run. Two schedulers would run ledger:verify,
; audit:verify and backups:run twice every night, and the second backup would
; overwrite nothing but waste the disk and the lock. numprocs is 1 for that
; reason and must stay 1.
;
; This is the alternative to a cron entry. If cron is used instead, do not run
; both: pick one. The equivalent line is
;   * * * * * cd /var/www/nexas/current && /usr/bin/php artisan schedule:run >> /dev/null 2>&1

[group:nexas]
programs = nexas-worker,nexas-scheduler
